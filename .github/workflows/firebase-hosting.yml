name: Publicar Conecta no Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIADECHAT }}
          projectId: triadechat
          channelId: live
        
        - name: Autenticar para publicar funções
          uses: google-github-actions/auth@v2
          with:
            credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIADECHAT }}

        - name: Publicar funções do Firebase
          run: npx firebase-tools deploy --only functions --project triadechat
