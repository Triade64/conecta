name: Conecta para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Conecta-Windows
          path: desktop/dist/Conecta-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar atualização
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A versão $version já foi publicada. Aumente a versão para publicar uma nova atualização."
            exit 0
          }
          gh release create $tag "dist/Conecta-Setup-$version-x64.exe" "dist/Conecta-Setup-$version-x64.exe.blockmap" "dist/latest.yml" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Conecta para Windows $version" --notes "Atualização do aplicativo Conecta para Windows. Instale pelo aplicativo ou baixe o instalador abaixo." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
